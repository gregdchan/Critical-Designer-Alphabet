# Railway Railpack TOML for Sanity CMS

[build]
  command = "npm ci && npm run build"

[deploy]
  start = "PORT=${PORT:-3333} npm run start -- --host 0.0.0.0 --port $PORT"

# Environment variables for Sanity CMS
[variables]
VITE_SANITY_PROJECT_ID = "pctfp1xq"
VITE_SANITY_DATASET = "production"
VITE_SANITY_API_VERSION = "2024-09-01"

[static]
  directory = "static"
