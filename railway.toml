# Railway Railpack TOML for SvelteKit + Sanity CMS + Supabase
# This configures the primary SvelteKit frontend service

[build]
  command = "cd designeralphabet && npm install && SUPABASE_SERVICE_ROLE=$SUPABASE_SERVICE_ROLE npm run build"
