version: '3.9'

services:
  web:
    build:
      context: ./designeralphabet
      dockerfile: Dockerfile
    image: critical-designer-alphabet-web
    env_file:
      - designeralphabet/.env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=5173
    ports:
      - '3000:5173'
    restart: unless-stopped

  studio:
    build:
      context: ./content
      dockerfile: Dockerfile
    image: critical-designer-alphabet-studio
    env_file:
      - content/.env
    environment:
      - NODE_ENV=production
      - PORT=3333
    ports:
      - '3333:3333'
    restart: unless-stopped
